name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'          # Laravel 12 OK di 8.3
          tools: composer:2.5.5
          coverage: none
          extensions: mbstring, intl, pdo, sqlite, bcmath, openssl

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache
            vendor
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install PHP deps
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: 'npm'

      - name: Install JS deps
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm i --no-audit --no-fund; fi

      # - name: Build assets
      #   run: npm run build

      - name: Prepare test env (SQLite)
        shell: bash
        run: |
          cp .env.example .env
          cat > .env.testing <<'EOF'
          APP_ENV=testing
          APP_KEY=
          DB_CONNECTION=sqlite
          DB_DATABASE=${{ github.workspace }}/database/database.sqlite
          CACHE_DRIVER=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          MAIL_MAILER=array
          EOF
          mkdir -p database
          touch database/database.sqlite
          php artisan key:generate --env=testing
          php artisan migrate --env=testing --no-interaction -v

      - name: Run tests
        env:
          APP_ENV: testing
        run: php artisan test --env=testing --parallel --no-coverage -q
